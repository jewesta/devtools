# Copy outside the repository and replace the hostname and username.
# No password property is accepted. The launcher prompts with echo disabled.
imap.host=imap.example.invalid
imap.port=993
imap.username=your-imap-login
proxy.port=1143
# Homebrew CA bundle on macOS. An absolute, readable PEM bundle is required.
tls.ca-file=/opt/homebrew/etc/ca-certificates/cert.pem
nginx.executable=/opt/homebrew/bin/nginx
